<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pauta: organize estudo e trabalho em um só lugar. Rotina semanal, tarefas, notas, prazos, temporizador de foco, revisões espaçadas e progresso. Funciona no navegador, sem cadastro.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; media-src data: blob:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta property="og:type" content="website"><meta property="og:title" content="Pauta: estudo e trabalho"><meta property="og:description" content="Rotina, tarefas, notas, prazos, foco e revisões espaçadas em um só lugar.">

<title>Pauta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lateral fixa no desktop, barra de abas no celular. Base clara e calma, roxo como cor principal, azul celeste de apoio. */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface2:#EBEEF8; --ink:#1D2140; --muted:#5E6584; --line:#DADFEE;
  --accent:#6C47D9; --accent-ink:#FFFFFF; --accent-soft:#EEEAFB; --sky:#3FA2E8; --sky-soft:#E1F1FD; --sky-ink:#0B5F9E;
  --ok:#15803D; --ok-bg:#DCF3E4; --bad:#C03A3A; --bad-bg:#FBE4E4; --warn:#955800; --warn-bg:#FCEBC8;
  --c0:#2E8BD6; --c1:#6C47D9; --c2:#0F8A8A; --c3:#C23E8F; --c4:#4F5BD5; --c5:#B7791F; --c6:#D64B5E; --c7:#5E6584;
  --shadow:0 1px 2px rgba(29,33,64,.05),0 4px 14px rgba(29,33,64,.05);
  --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12142A; --surface:#1B1E3A; --surface2:#262A4B; --ink:#E9EBFB; --muted:#A3A9CC; --line:#343960;
    --accent:#A58BFF; --accent-ink:#140B33; --accent-soft:#2D2656; --sky:#6CC0FF; --sky-soft:#173553; --sky-ink:#8FD0FF;
    --ok:#5FD08C; --ok-bg:#16382A; --bad:#F28A8A; --bad-bg:#42202A; --warn:#EBBE55; --warn-bg:#3A2F10;
    --c0:#6CC0FF; --c1:#A58BFF; --c2:#4FD1C5; --c3:#F58AC8; --c4:#8F9BFF; --c5:#E6B85C; --c6:#F58A9A; --c7:#A3A9CC;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12142A; --surface:#1B1E3A; --surface2:#262A4B; --ink:#E9EBFB; --muted:#A3A9CC; --line:#343960;
  --accent:#A58BFF; --accent-ink:#140B33; --accent-soft:#2D2656; --sky:#6CC0FF; --sky-soft:#173553; --sky-ink:#8FD0FF;
  --ok:#5FD08C; --ok-bg:#16382A; --bad:#F28A8A; --bad-bg:#42202A; --warn:#EBBE55; --warn-bg:#3A2F10;
  --c0:#6CC0FF; --c1:#A58BFF; --c2:#4FD1C5; --c3:#F58AC8; --c4:#8F9BFF; --c5:#E6B85C; --c6:#F58A9A; --c7:#A3A9CC;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
kbd{font-family:var(--f-mono);font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* lateral */
.side{position:fixed;left:0;top:0;bottom:0;width:224px;z-index:20;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 22px) 14px 18px max(14px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mk{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 6px rgba(108,71,217,.28))}
.brand b{font-weight:800;font-size:21px;letter-spacing:-.03em;display:block;line-height:1.05}
.brand small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;flex-direction:column;gap:2px}
.tabs a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.tabs a:hover{background:var(--surface2);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tabs .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.tabs a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#count{font-size:13px;background:var(--sky-soft);color:var(--sky-ink);padding:10px 12px;border-radius:10px;line-height:1.4}
.keys{font-size:12px;color:var(--muted);line-height:1.9;margin-top:auto}
.themebtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.themebtn:hover{border-color:var(--accent);color:var(--accent)}
.count{font-family:var(--f-mono);font-size:13px;background:var(--sky-soft);color:var(--sky-ink);padding:6px 11px;border-radius:8px;white-space:nowrap}
.count strong{font-weight:500}
main{margin-left:224px;max-width:1280px;padding:28px clamp(18px,2.4vw,40px) 80px}
@media (max-width:859px){
  .side{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;width:auto;flex-direction:row;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow:visible}
  .brand small,.keys{display:none}.brand .mk{width:28px;height:28px}
  #count{margin:0 0 0 auto;padding:5px 9px;font-size:12px;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;flex-direction:row;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabs::-webkit-scrollbar{display:none}
  .tabs a{flex:1 0 auto;justify-content:center;flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}
  .tabs a svg{width:20px;height:20px}
  .tabs .n{position:absolute;margin:0;transform:translate(14px,-4px)}
  .tabs a{position:relative}
  .themebtn{order:3;margin:0;padding:6px 10px}.themebtn .tl{display:none}
  .side:has(#count[hidden]) .themebtn{margin-left:auto}
  main{margin-left:0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
}

/* telas */
.view{display:grid;gap:18px}
.view>header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;justify-content:space-between}
.view>header h1{font-size:clamp(24px,3.6vw,32px);font-weight:800;letter-spacing:-.02em}
.view>header p{color:var(--muted);margin:6px 0 0;max-width:80ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;font-weight:700;margin-bottom:12px}
.card h2 small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.stack{display:grid;gap:18px;min-width:0}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;margin-top:6px;letter-spacing:-.02em}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.kpi .s{color:var(--muted);font-size:13px;margin-top:4px}
.up{color:var(--ok)}.down{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;color:var(--sc,var(--c7));background:color-mix(in srgb,var(--sc,var(--c7)) 14%,transparent)}
.kind{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14px}
.banner p{margin:0;flex:1 1 280px}
.muted{color:var(--muted)}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--sc,var(--accent));border-radius:99px}
.bar.ok i{background:var(--ok)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* formulários */
form.f{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end}
form.f label,.fld{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
form.f input,form.f select,.inp,.fld input,.fld select,.fld textarea{font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:100%}
form.f input:focus,form.f select:focus,.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
form.f label.grow{flex:1 1 200px}form.f label.sm{flex:0 1 130px}form.f label.md{flex:0 1 150px}
.days-pick{display:flex;flex-wrap:wrap;gap:6px}
form.f .days-pick label,.days-pick label{display:flex;flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink);cursor:pointer}
form.f .days-pick input,.days-pick input{width:auto;padding:0;accent-color:var(--accent)}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;font-size:15px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.quick input:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}

/* dia */
.dnav{display:flex;gap:6px;align-items:center}
.slot{display:grid;grid-template-columns:auto 104px 1fr auto;gap:12px;align-items:start;padding:13px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.slot time{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px}
.slot h3{font-size:15px;font-weight:700}
.slot .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:5px;font-size:13px;color:var(--muted)}
.slot.done h3{text-decoration:line-through;color:var(--muted)}
.slot.now{background:var(--accent-soft);margin-inline:-18px;padding-inline:18px;border-top-color:transparent}
.gap{display:grid;grid-template-columns:auto 104px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.gap::before{content:"";width:20px}
.gap time{font-family:var(--f-mono);font-size:13px}
@media (max-width:560px){.slot,.gap{grid-template-columns:auto 1fr auto}.slot time,.gap time{grid-column:2;grid-row:1}.slot>div,.gap>span{grid-column:2}.slot>.btn,.gap>.btn{grid-column:3;grid-row:1}}
.rev{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rev:first-of-type{border-top:0}
.rev b{font-weight:700}
.rv-btns{display:flex;gap:6px}
.wkrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.wkrow:first-of-type{border-top:0}
.wkrow .bar{grid-column:1/-1;margin:0}
textarea.note{width:100%;min-height:96px;resize:vertical;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea.note:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}

/* semana */
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dcol{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.dcol h3{font-size:14px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dcol h3 span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.dcol.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wb{border-radius:8px;background:color-mix(in srgb,var(--sc,var(--c7)) 12%,var(--surface));padding:7px 9px;font-size:13px;display:grid;gap:2px;position:relative;box-shadow:inset 3px 0 0 var(--sc,var(--c7))}
.wb time{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-left:3px}
.wb b{font-weight:600;line-height:1.25;padding:0 18px 0 3px;overflow-wrap:anywhere}
.wb button{position:absolute;top:3px;right:3px;border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%;line-height:1}
.wb button:hover{background:var(--bad-bg);color:var(--bad)}
.wb.cf{box-shadow:inset 3px 0 0 var(--bad),0 0 0 1px var(--bad)}
.row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.row .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.row .bar{margin:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--sc,var(--c7));flex:none;border:0;padding:0}
button.dot:hover{outline:2px solid var(--line);outline-offset:2px}

/* matérias */
.subj{border-top:4px solid var(--sc,var(--c7))}
.subj h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.subj .nm{font-weight:700;font-size:16px;border:1px solid transparent;background:none;border-radius:8px;padding:2px 6px;min-width:0;flex:1 1 120px;font-family:var(--f-display)}
.subj .nm:hover,.subj .nm:focus{border-color:var(--line);background:var(--surface)}
.subj select.sk{font-size:12px;padding:3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.wk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.wk input{width:68px}
.topic{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.topic:first-of-type{border-top:0}
.topic input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.conf{display:flex;gap:3px}
.conf button{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:none;padding:0}
.conf button.on{background:var(--accent);border-color:var(--accent)}
.conf button:hover{border-color:var(--accent)}
@media (max-width:560px){.topic{grid-template-columns:auto 1fr auto}.topic .chip,.topic .conf{grid-column:2;grid-row:2;justify-self:start}.topic .chip{grid-row:3}}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.addrow input:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}

/* tarefas */
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.task h3{font-size:15px;font-weight:700}
.task h3 button{all:unset;cursor:pointer;border-radius:4px}
.task h3 button:hover{color:var(--accent)}
.task h3 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.task .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:5px;font-size:13px;color:var(--muted)}
.task.done h3{text-decoration:line-through;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters select{font-size:13px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.ev{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev .dd{text-align:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);padding:8px 4px}
.ev .dd b{display:block;font-size:24px;font-weight:800;line-height:1}
.ev .dd small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ev.past{opacity:.6}.ev.past .dd{background:var(--surface2);color:var(--muted)}
.ev.soon .dd{background:var(--warn-bg);color:var(--warn)}
.ev h3{font-size:16px}
.ev .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:5px;font-size:13px;color:var(--muted)}

/* foco */
.focus{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.focus{grid-template-columns:minmax(0,1fr)}}
.clock{display:grid;place-items:center;position:relative;max-width:300px;margin:0 auto}
.clock svg{width:100%;height:auto;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:10}
.clock .tr{stroke:var(--surface2)}.clock .pg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.clock.rest .pg{stroke:var(--sky)}
.clock .mid{position:absolute;text-align:center}
.clock .tm{font-family:var(--f-mono);font-size:42px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.clock .md{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sky-ink);margin-top:8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.cyc{display:flex;gap:6px;justify-content:center;margin-top:14px}
.cyc i{width:10px;height:10px;border-radius:50%;background:var(--surface2)}

function migrate(o){
  o.tasks=o.tasks||[];o.events=o.events||[];o.notes=o.notes||{};o.done=o.done||{};o.log=o.log||[];
  o.pomo=Object.assign({focus:25,rest:5,long:15,every:4,auto:false,sound:true},o.pomo||{});o.habits=o.habits||[];
  o.goal=o.goal||240;o.pages=o.pages||[];o.cards=o.cards||{};o.trash=o.trash||[];
  if(o.exam&&o.exam.date&&!o.events.length)o.events.push({id:uid(),name:o.exam.name||'Data-alvo',date:o.exam.date,subj:'',kind:'prova'});
  delete o.exam;
  const old=!o.v||o.v<3,map={0:0,1:2,2:4,3:5};
  o.subjects.forEach(s=>{s.kind=s.kind||'estudo';s.notes=s.notes||'';(s.topics=s.topics||[]).forEach(t=>{if(t.last===undefined)t.last=t.studied||null;if(t.conf===undefined)t.conf=0;if(old)t.rev=map[t.rev]??0})});
  o.tasks.forEach(t=>{t.subs=t.subs||[];t.est=t.est||0;t.notes=t.notes||'';t.rep=t.rep||''});
  migSubjects(o);
  o.v=3;return o;
}

function parseQuick(raw,defDue){
  let t=' '+raw+' ',o={title:'',subj:'',due:defDue||'',prio:'media',est:0,rem:''};
  t=t.replace(/\s!(\S+)(?=\s)/g,(m,p)=>{p=norm(p);const k={alta:'alta','1':'alta',media:'media','2':'media',baixa:'baixa','3':'baixa'}[p];if(k){o.prio=k;return ' '}return m});
  t=t.replace(/\s@(\S+)(?=\s)/g,(m,p)=>{p=norm(p);const s=S.subjects.find(x=>norm(x.name).startsWith(p))||S.subjects.find(x=>norm(x.name).includes(p));if(s){o.subj=s.id;return ' '}return m});
  t=t.replace(/\s~(\d+)(h|min)?(?=\s)/gi,(m,n,u)=>{o.est=clamp(Number(n)*(u&&u.toLowerCase()==='h'?60:1),5,720);return ' '});
  t=t.replace(/\s(\d{1,2})\/(\d{1,2})(?=\s)/g,(m,d,mo)=>{const n=new Date(),y=n.getFullYear();let dt=new Date(y,Number(mo)-1,Number(d));if(dkey(dt)<today())dt=new Date(y+1,Number(mo)-1,Number(d));if(dt.getMonth()===Number(mo)-1){o.due=dkey(dt);return ' '}return m});
  const W={'hoje':0,'amanha':1,'amanhã':1,'depois de amanha':2,'depois de amanhã':2};
  t=t.replace(/\s(depois de amanh[ãa]|amanh[ãa]|hoje)(?=\s)/gi,(m,w)=>{o.due=addDays(today(),W[w.toLowerCase()]);return ' '});
  const D={seg:0,ter:1,qua:2,qui:3,sex:4,sab:5,'sáb':5,dom:6};
  t=t.replace(/\s(seg|ter|qua|qui|sex|s[áa]b|dom)(?=\s)/gi,(m,w)=>{const i=D[w.toLowerCase()];let n=(i-dow(today())+7)%7;if(n===0)n=7;o.due=addDays(today(),n);return ' '});
  t=t.replace(/\s(?:[àa]s\s+)?(\d{1,2})(?:h(\d{2})?|:(\d{2}))(?=\s)/gi,(m,h,m1,m2)=>{const hh=Number(h),mm=Number(m1||m2||0);if(hh>23||mm>59)return m;o.rem=pad(hh)+':'+pad(mm);return ' '});
  if(o.rem){o.due=o.due||today();o.rem=o.due+'T'+o.rem}
  o.title=t.replace(/\s+/g,' ').trim();
  return o;
}

/* intervalos livres de um dia (>= 30 min), dentro da janela 06:00–22:00 */
function gaps(d){
  const bl=blocksFor(d).map(b=>[toMin(b.start),toMin(b.end)]).sort((a,b)=>a[0]-b[0]);
  let from=DAY0;if(d===today())from=Math.max(from,Math.ceil(nowMin()/15)*15);
  const out=[];
  for(const [s,e] of bl){if(s-from>=30)out.push([from,s]);from=Math.max(from,e)}
  if(DAY1-from>=30)out.push([from,DAY1]);
  return out;
}

  S.tasks.filter(x=>!x.done&&x.due&&x.due<=d&&!bl.some(b=>b.task===x.id)).sort((a,b)=>PR[a.prio]-PR[b.prio]||a.due.localeCompare(b.due)).forEach(x=>items.push({title:x.title,subj:x.subj,task:x.id,min:clamp(x.est||45,15,180)}));

    weekGoals().forEach(({s,rem})=>{if(bl.some(b=>b.subj===s.id))return;items.push({title:'Estudar '+s.name,subj:s.id,task:'',min:clamp(Math.ceil(rem/left/15)*15,30,90)})});
  }

    const gi=g.findIndex(x=>x[1]-x[0]>=Math.min(it.min,30));if(gi<0)continue;

const habitStreak=(h,d)=>{let k=h.days[d]?d:addDays(d,-1),n=0;while(h.days[k]&&n<2000){n++;k=addDays(k,-1)}return n};
function weekSummary(){
  const ws=weekStart(),we=addDays(ws,6),L=S.log.filter(l=>l.date>=ws&&l.date<=we),tot=L.reduce((n,l)=>n+l.min,0);
  const by={estudo:0,trabalho:0,pessoal:0};L.forEach(l=>{by[subj(l.subj)?.kind||'estudo']+=l.min});
  const per=S.subjects.map(s=>({s,m:L.reduce((n,l)=>l.subj===s.id?n+l.min:n,0)})).filter(x=>x.m).sort((a,b)=>b.m-a.m);
  const days=[...Array(7)].map((_,i)=>addDays(ws,i)).filter(d=>d<=today()),hit=days.filter(d=>minsOn(d)>=S.goal).length;
  const tdone=S.tasks.filter(x=>x.done&&x.doneAt>=ws&&x.doneAt<=we),Q=L.filter(l=>l.q>0),q=Q.reduce((n,l)=>n+l.q,0),H=Q.filter(l=>l.hit!=null),hq=H.reduce((n,l)=>n+l.q,0),hh=H.reduce((n,l)=>n+l.hit,0);
  const weak=[];S.subjects.forEach(s=>s.topics.forEach(x=>{if(x.studied&&x.conf>0&&x.conf<=2)weak.push(x.name)}));
  const late=S.tasks.filter(x=>!x.done&&x.due&&x.due<today()).length;
  const nx=S.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const lines=[`Resumo da semana (${dshort(ws)} a ${dshort(we)})`,
    `Tempo total: ${fmt(tot)} (estudo ${fmt(by.estudo)}, trabalho ${fmt(by.trabalho)}${by.pessoal?`, pessoal ${fmt(by.pessoal)}`:''})`,
    `Meta diária batida em ${hit} de ${days.length} ${days.length===1?'dia':'dias'}. Sequência atual: ${streak()} ${streak()===1?'dia':'dias'}.`,
    `Tarefas concluídas: ${tdone.length}${late?` · ${late} em atraso`:''}`];
  if(per.length)lines.push('Mais tempo em: '+per.slice(0,3).map(x=>`${x.s.name} (${fmt(x.m)})`).join(', '));
  if(q)lines.push(`Questões: ${q}${hq?` · acerto de ${Math.round(hh/hq*100)}%`:''}`);
  if(weak.length)lines.push('Para reforçar: '+weak.slice(0,5).join(', '));
  if(nx)lines.push(`Próximo prazo: ${nx.name} em ${dshort(nx.date)}`);
  return lines.join('\n');
}

/* ---------- Progresso ---------- */
function chart(){
  const t=today(),N=14,days=[];
  for(let i=N-1;i>=0;i--){const d=addDays(t,-i);days.push({d,m:minsOn(d)})}
  const mx=Math.max(S.goal,...days.map(x=>x.m))*1.08;
  const step=mx<=300?60:mx<=600?120:180,top=Math.ceil(mx/step)*step;
  const W=600,H=230,L=38,R=8,Tp=14,B=44,pw=W-L-R,ph=H-Tp-B,bw=pw/N;
  const y=v=>Tp+ph-(v/top)*ph;
  let g='';
  for(let v=0;v<=top;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v/60}h</text>`;
  const bars=days.map((x,i)=>{
    const bx=L+i*bw+bw*.18,w=bw*.64,h=(x.m/top)*ph,dt=parse(x.d);
    return `<rect class="${x.d===t?'bt':x.m>=S.goal?'bg':'b'}" x="${bx}" y="${y(x.m)}" width="${w}" height="${Math.max(h,0)}" rx="2"><title>${dt.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}: ${fmt(x.m)}</title></rect>
    <text x="${bx+w/2}" y="${H-24}" text-anchor="middle">${dt.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','').slice(0,3)}</text>
    <text x="${bx+w/2}" y="${H-10}" text-anchor="middle">${dt.getDate()}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tempo estudado nos últimos 14 dias">${g}<line class="goal" x1="${L}" x2="${W-R}" y1="${y(S.goal)}" y2="${y(S.goal)}"/><text class="gt" x="${W-R}" y="${y(S.goal)-5}" text-anchor="end">meta ${fmt(S.goal)}</text>${bars}</svg>`;
}
function heat(){
  const t=today(),W=17,start=addDays(weekStart(),-(W-1)*7),cs=22,gp=5,L=20,T0=16;
  let cells='',months='',lastM=-1;
  for(let w=0;w<W;w++){
    const d0=addDays(start,w*7),dm=parse(d0).getMonth();
    if(dm!==lastM){months+=`<text x="${L+w*(cs+gp)}" y="10">${parse(d0).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</text>`;lastM=dm}
    for(let i=0;i<7;i++){const d=addDays(d0,i);if(d>t)continue;const m=minsOn(d);const lv=!m?0:m<S.goal*.5?1:m<S.goal?2:m<S.goal*1.5?3:4;
      cells+=`<rect class="hm l${lv}${d===t?' now':''}" data-act="goto-day" data-d="${d}" style="cursor:pointer" x="${L+w*(cs+gp)}" y="${T0+i*(cs+gp)}" width="${cs}" height="${cs}" rx="3"><title>${parse(d).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'})}: ${m?fmt(m):'sem estudo'}</title></rect>`}
  }
  const lab=['S','T','Q','Q','S','S','D'].map((l,i)=>i%2===0?`<text x="0" y="${T0+i*(cs+gp)+15}">${l}</text>`:'').join('');
  const Wd=L+W*(cs+gp),Hd=T0+7*(cs+gp);
  return `<svg class="chart" style="width:${Wd}px;min-width:0;max-height:none" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Calendário de estudo das últimas ${W} semanas">${months}${lab}${cells}</svg>
  <div class="legend"><span><i class="hm" style="background:var(--surface2)"></i>sem estudo</span><span><i style="background:color-mix(in srgb,var(--accent) 52%,var(--surface2))"></i>abaixo da meta</span><span><i style="background:var(--accent)"></i>acima da meta</span></div>`;
}
function vProgresso(){
  const t=today(),ws=weekStart(),we=addDays(ws,6),pws=addDays(ws,-7);
  const wlog=S.log.filter(l=>l.date>=ws&&l.date<=we);
  const wtot=wlog.reduce((n,l)=>n+l.min,0);
  const ptot=S.log.reduce((n,l)=>l.date>=pws&&l.date<ws?n+l.min:n,0);
  const dl=ptot?Math.round((wtot-ptot)/ptot*100):null;
  const days7=[...Array(7)].map((_,i)=>minsOn(addDays(t,-i)));
  const best=Math.max(...days7),goalDays=days7.filter(m=>m>=S.goal).length;
  const rows=S.subjects.map(s=>({s,m:wlog.reduce((n,l)=>l.subj===s.id?n+l.min:n,0)}));

  const due={};S.tasks.filter(x=>!x.done&&x.due).forEach(x=>{due[x.due]=(due[x.due]||0)+1});

/* Markdown simples */
function mdInline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g,'$1<em>$2</em>').replace(/==([^=]+)==/g,'<mark>$1</mark>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/\[\[([^\]]+)\]\]/g,(m,t)=>`<button type="button" class="wl" data-act="n-link" data-t="${t}">${t}</button>`);
  s=s.replace(/(^|\s)#([\p{L}\d_-]{2,})/gu,'$1<button type="button" class="tg" data-act="n-tag" data-v="$2">#$2</button>');
  return s;
}
function md(body){
  const L=String(body||'').split('\n'),out=[];let i=0,list='';
  const close=()=>{if(list){out.push(list.startsWith('ol')?'</ol>':'</ul>');list=''}};
  const open=k=>{if(list!==k){close();out.push(k==='ol'?'<ol>':k==='ck'?'<ul class="ck">':'<ul>');list=k}};
  while(i<L.length){
    const ln=L[i];let m;
    if(/^```/.test(ln)){close();const buf=[];i++;while(i<L.length&&!/^```/.test(L[i])){buf.push(L[i]);i++}i++;out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);continue}
    if(m=ln.match(/^(#{1,3})\s+(.*)$/)){close();const n=m[1].length+1;out.push(`<h${n} id="h${i}">${mdInline(m[2])}</h${n}>`);i++;continue}
    {const cm=!/^\s*[-*]\s+\[/.test(ln)&&ln.replace(/^\s*(?:[-*]\s+|\d+[.)]\s+)/,'').match(CARD_RE);if(cm){close();out.push(`<details class="qa"><summary>${mdInline(cm[1])}</summary><div>${mdInline(cm[2])}</div></details>`);i++;continue}}
    if(m=ln.match(/^\s*[-*]\s+\[([ xX])\]\s?(.*)$/)){open('ck');const on=m[1]!==' ';out.push(`<li class="${on?'on':''}"><input type="checkbox" data-act="n-ck" data-l="${i}" ${on?'checked':''} aria-label="Marcar item"><span>${mdInline(m[2])}</span></li>`);i++;continue}
    if(m=ln.match(/^\s*[-*]\s+(.*)$/)){open('ul');out.push(`<li>${mdInline(m[1])}</li>`);i++;continue}
    if(m=ln.match(/^\s*\d+[.)]\s+(.*)$/)){open('ol');out.push(`<li>${mdInline(m[1])}</li>`);i++;continue}
    if(m=ln.match(/^>\s?(.*)$/)){close();const c=m[1].match(/^\[!(dica|atencao|atenção|importante|nota)\]\s*(.*)$/i);if(c){const k=norm(c[1]);out.push(`<div class="callout ${k}"><span aria-hidden="true">${{dica:'💡',atencao:'⚠️',importante:'❗',nota:'📝'}[k]}</span><div>${mdInline(c[2])}</div></div>`)}else out.push(`<blockquote>${mdInline(m[1])}</blockquote>`);i++;continue}
    if(/^---+\s*$/.test(ln)){close();out.push('<hr>');i++;continue}
    if(!ln.trim()){close();i++;continue}
    close();out.push(`<p>${mdInline(ln)}</p>`);i++;
  }
  close();return out.join('');
}

const headings=b=>{const o=[];let f=false;String(b||'').split('\n').forEach((l,i)=>{if(/^```/.test(l)){f=!f;return}if(f)return;const m=l.match(/^(#{1,3})\s+(.*)$/);if(m)o.push({i,n:m[1].length,t:m[2].replace(/[*`=]/g,'')})});return o};
const hsh=s=>{let h=5381;s=norm(s);for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};

}

/* tabela de tarefas */
function ttable(rows){
  const V={title:x=>norm(x.title),subj:x=>norm(sname(x.subj)),due:x=>x.due||'9999',prio:x=>({alta:0,media:1,baixa:2})[x.prio]??1,st:x=>x.done?2:x.st==='doing'?1:0,est:x=>x.est||0};
  rows=rows.slice().sort((a,b)=>{const A=V[tsort.k](a),B=V[tsort.k](b);return (A<B?-1:A>B?1:0)*tsort.d});
  const th=(k,n)=>`<th scope="col" aria-sort="${tsort.k===k?(tsort.d>0?'ascending':'descending'):'none'}"><button type="button" data-act="tsort" data-k="${k}">${n}${tsort.k===k?(tsort.d>0?' ▲':' ▼'):''}</button></th>`;
  if(!rows.length)return '<div class="card"><div class="empty">Nenhuma tarefa com esses filtros.</div></div>';
  return `<div class="card twrap"><table class="tbl"><thead><tr><th></th>${th('title','Tarefa')}${th('subj','Matéria')}${th('due','Prazo')}${th('prio','Prioridade')}${th('st','Status')}${th('est','Tempo')}</tr></thead><tbody>${rows.map(x=>{const l=x.due&&!x.done?dueLabel(x.due):null;return `<tr class="${x.done?'done':''}"><td><input type="checkbox" data-act="tgl-task" data-id="${x.id}" ${x.done?'checked':''} aria-label="Concluir ${esc(x.title)}"></td><td><button type="button" class="lk" data-act="open-task" data-id="${x.id}">${esc(x.title)}</button></td><td>${tag(x.subj)}</td><td>${l?`<span class="chip ${l.c}">${l.t}</span>`:x.due?dshort(x.due):'<span class="muted">sem prazo</span>'}</td><td><span class="chip ${PC[x.prio]}">${PL[x.prio]}</span></td><td>${x.done?'Concluída':x.st==='doing'?'Em andamento':'A fazer'}</td><td>${x.est?fmt(x.est):''}</td></tr>`}).join('')}</tbody></table></div>`;
}

function chrome(){
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.v===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const n=dueCount(),b=$('#revn');b.hidden=!n;b.textContent=n;
  const tn=$('#taskn'),tk=taskDue();tn.hidden=!tk;tn.textContent=tk;
  const c=$('#count'),nx=S.events.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];
  if(nx){const d=diffDays(nx.date,today());c.hidden=false;const nm=esc(nx.name);c.innerHTML=d>0?`${nm} · faltam <strong>${d} ${d===1?'dia':'dias'}</strong>`:`<strong>${nm} é hoje</strong>`}
  else c.hidden=true;
}
function renderApp(){
  $('#app').innerHTML='<div id="rem">'+remHTML()+'</div>'+RENDER[view]();
  chrome();
  if(view==='foco')updTimer();
  if(view==='progresso'){const bk=$('#bk');if(bk)bk.value=JSON.stringify(S)}
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}
function go(v){view=v;if(location.hash.slice(1)!==v)location.hash=v;render();window.scrollTo(0,0)}

/* ---------- temporizador ---------- */
let wl=null;
function wakeOn(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{wl=l}).catch(()=>{})}catch(e){}}
function wakeOff(){try{if(wl){wl.release();wl=null}}catch(e){}}
function beep(){if(S.pomo.sound===false)return;try{const A=window.AudioContext||window.webkitAudioContext;const a=new A();[0,.22,.44].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.14)})}catch(e){}}
const MODE={focus:'Foco',rest:'Pausa',long:'Pausa longa'};
function updTimer(){
  const l=leftMs(),s=Math.ceil(l/1000);
  document.title=T.running?pad(Math.floor(s/60))+':'+pad(s%60)+' · '+MODE[T.mode]:'Pauta';
  const tm=$('#tm');if(!tm)return;
  tm.textContent=pad(Math.floor(s/60))+':'+pad(s%60);
  const r=$('#ring');if(r)r.style.strokeDashoffset=C*(1-l/(totalMs()||1));
  const m=$('#tmode');if(m)m.textContent=MODE[T.mode];
}
function tComplete(){
  T.running=false;wakeOff();document.title='Pauta';
  if(T.mode==='focus'){
    const l=addLog(today(),T.subj,S.pomo.focus,'foco',{task:T.task||''});
    M={type:'ask',id:l.id,mins:S.pomo.focus,subj:T.subj,focus:'#askq'};
    T.cycles++;const long=T.cycles%S.pomo.every===0;T.mode=long?'long':'rest';
    const skip=totalMs()===0;if(skip)T.mode='focus';save();
    toast(`Ciclo concluído: +${S.pomo.focus} min registrados. ${skip?'Sem pausa configurada: próximo foco.':long?'Hora da pausa longa.':'Hora da pausa.'}`);
  }else{T.mode='focus';toast('Pausa terminou. Pronto para o próximo ciclo.')}
  T.left=totalMs();
  if(S.pomo.auto&&T.left>0){T.endAt=Date.now()+T.left;T.running=true;wakeOn()}
  saveT();beep();render();
}
setInterval(()=>{if(T.running){if(leftMs()<=0)tComplete();else updTimer()}},250);
setInterval(()=>{if(view==='hoje'&&cur===today()&&!M&&(!document.activeElement||document.activeElement===document.body))renderApp()},60000);

/* ---------- ações ---------- */
function toggleBlock(id){
  const b=S.blocks.find(x=>x.id===id);if(!b)return;
  const d=S.done[cur]||(S.done[cur]={});
  const x=b.task?taskById(b.task):null;
  if(d[id]){delete d[id];S.log=S.log.filter(l=>!(l.src===id&&l.date===cur));if(x&&x.done)setTaskDone(x,false)}
  else{d[id]=true;addLog(cur,b.subj,dur(b),id,{task:b.task||''});if(x&&!x.done){setTaskDone(x,true);toast('Bloco feito e tarefa concluída.')}}
}
async function dlBackup(){
  const txt=JSON.stringify(S,null,1);
  if(await dlFile(`pauta-backup-${today()}.json`,txt,'Backup salvo.'))return;
  const bk=$('#bk');if(bk){bk.value=JSON.stringify(S);bk.select()}
  toast('Não foi possível baixar aqui. Copie o texto do campo.');
}
async function dlFile(name,txt,ok){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:txt});toast(ok);return true}
  }catch(e){if(e&&e.code==='declined')return true}
  if(!(window.claude&&window.claude.use)){
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:name.endsWith('.csv')?'text/csv;charset=utf-8':name.endsWith('.md')?'text/markdown;charset=utf-8':'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast(ok);return true}catch(e){}
  }
  return false;
}

}

    if(!restoreFrom(bk.value))return 'keep';return 'keep'},

document.addEventListener('click',e=>{

document.addEventListener('change',e=>{
  const el=e.target.closest('[data-chg]');if(!el)return;
  const k=el.dataset.chg;
  if(k==='note'){S.notes[cur]=el.value;save();return}
  if(k==='jump'){if(el.value){cur=el.value;save();render()}return}
  if(k==='snote'){const s=subj(el.dataset.id);if(s){s.notes=el.value;save()}return}
  if(k==='tq')return;
  if(k==='syfile'){const f=el.files&&el.files[0];if(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(String(r.result));if(!o||!Array.isArray(o.subjects))throw 0;
      if(S.sample&&!S.mt){S=migrate(o);S.mt=o.mt||Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof fsDirty==='function')fsDirty();toast('Dados carregados do arquivo.')}
      else{S=mergeState(S,o);save();toast('Dados mesclados com o arquivo.')}
      render()}catch(e){toast('Arquivo inválido. Use um arquivo do Pauta.')}};r.readAsText(f);el.value=''}return}
  if(k==='bkfile'){const f=el.files&&el.files[0];if(f){const r=new FileReader();r.onload=()=>restoreFrom(String(r.result));r.readAsText(f)}return}
  if(k==='tf'){
    const x=taskById(M&&M.id);if(!x)return;const f=el.dataset.f;
    if(f==='est')x.est=clamp(Math.round(Number(el.value))||0,0,720);
    else if(f==='title'){const v=el.value.trim();if(v)x.title=v;else el.value=x.title}
    else{x[f]=el.value;if(f==='rem')x.remAck=false}
    save();renderApp();return;
  }
  if(k==='nsubj'){const p=curPage();if(p){p.subj=el.value;p.u=Date.now()}}
  else if(k==='ntags'){const p=curPage();if(p){p.tags=el.value.split(/[,;]/).map(x=>x.trim().replace(/^#/,'').toLowerCase()).filter(Boolean).slice(0,12);p.u=Date.now()}}
  else if(k==='wk'){const s=subj(el.dataset.id);if(s)s.wk=Math.round(clamp(Number(el.value)||0,0,60)*60)}
  else if(k==='sname'){const s=subj(el.dataset.id),v=el.value.trim();if(s&&v)s.name=v}
  else if(k==='skind'){const s=subj(el.dataset.id);if(s)s.kind=el.value}
  else if(k==='tsubj'){T.subj=el.value;saveT();return}
  else if(k==='ttask'){T.task=el.value;if(T.task&&taskById(T.task))T.subj=taskById(T.task).subj;saveT()}
  else if(k==='tfs'){tfs=el.value}
  else if(k==='tfk'){tfk=el.value}
  else if(k==='pomo'){const f=el.form.elements;S.pomo.focus=numIn(f['focus'].value,25,5,120);S.pomo.rest=numIn(f['rest'].value,5,0,30);S.pomo.long=numIn(f['long'].value,15,0,60);S.pomo.every=numIn(f['every'].value,4,2,8);S.pomo.auto=f['auto'].checked;S.pomo.sound=f['sound'].checked;if(!T.running){if(T.mode!=='focus'&&totalMs()===0)T.mode='focus';T.left=totalMs();saveT()}}
  save();render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,k=f.dataset.form;if(!k)return;
  const d=new FormData(f);
  if(k==='blk-day'||k==='blk-week'){
    const start=d.get('start'),end=d.get('end');
    if(!start||!end||toMin(end)<=toMin(start)){toast('O horário de fim precisa ser depois do início.');return}
    const sid=d.get('subj')||'',kind=d.get('kind');
    const title=(d.get('title')||'').trim()||`${KINDS[kind]} · ${sname(sid)}`;
    const b={id:uid(),title,subj:sid,kind,start,end,days:null,date:null};
    if(k==='blk-day')b.date=cur;
    else{b.days=d.getAll('days').map(Number);if(!b.days.length){toast('Escolha pelo menos um dia da semana.');return}}
    S.blocks.push(b);const clash=b.date?conflicts(blocksFor(cur)).has(b.id):b.days.some(i=>conflicts(S.blocks.filter(x=>!x.date&&(x.days||[]).includes(i))).has(b.id));toast(clash?'Bloco adicionado, mas conflita com outro horário.':'Bloco adicionado.');
  }else if(k==='blk-edit'){
    const b=S.blocks.find(y=>y.id===M?.id);if(!b)return;
    const start=d.get('start'),end=d.get('end');
    if(!start||!end||toMin(end)<=toMin(start)){toast('O horário de fim precisa ser depois do início.');return}
    let days=b.days;if(!b.date){days=d.getAll('days').map(Number);if(!days.length){toast('Escolha pelo menos um dia da semana.');return}}
    const sid=d.get('subj')||'',kind=d.get('kind');
    Object.assign(b,{title:(d.get('title')||'').trim()||`${KINDS[kind]} · ${sname(sid)}`,subj:sid,kind,start,end,days});M=null;toast('Bloco atualizado.');
  }else if(k==='habit'){
    const n=(d.get('name')||'').trim();if(!n)return;S.habits.push({id:uid(),name:n,days:{}});
  }else if(k==='sched'){
    const start=d.get('start'),du=clamp(Math.round(Number(d.get('dur'))),10,480),sm=toMin(start);
    if(!start||!du)return;
    const [ty,id]=String(d.get('what')).split(':');
    let title,sid='',kind='teoria',task='';
    if(ty==='t'){const x=taskById(id);if(!x)return;title=x.title;sid=x.subj;task=x.id;kind=(subj(sid)?.kind==='trabalho')?'trabalho':'questoes'}
    else if(ty==='s'){sid=id;title=`Estudar ${sname(id)}`;kind=subj(id)?.kind==='trabalho'?'trabalho':'teoria'}
    else title='Bloco livre';
    const b={id:uid(),title,subj:sid,kind,start:hhmm(sm),end:hhmm(Math.min(sm+du,23*60+59)),days:null,date:cur,task};
    S.blocks.push(b);M=null;toast(conflicts(blocksFor(cur)).has(b.id)?'Agendado, mas conflita com outro bloco.':'Agendado no cronograma.');
  }else if(k==='ask'){
    const q=Math.round(Number(d.get('q'))),h=d.get('hit')===''?null:Math.round(Number(d.get('hit'))),lg=S.log.find(x=>x.id===M?.id);
    if(lg&&q>0){lg.q=Math.min(q,999);if(h!=null&&h>=0)lg.hit=Math.min(h,lg.q);toast(`${lg.q} questões em ${M.mins} min: média de ${avgQ(M.mins,lg.q)} por questão${lg.hit!=null?` e ${Math.round(lg.hit/lg.q*100)}% de acerto`:''}.`)}
    M=null;
  }else if(k==='quick'||k==='quick-task'){
    const p=parseQuick(d.get('title')||'',k==='quick'?cur:'');if(!p.title)return;
    S.tasks.push({id:uid(),title:p.title,subj:p.subj,due:p.due,prio:p.prio,est:p.est,done:false,notes:'',subs:[],rep:'',rem:p.rem||'',st:''});
    toast(p.rem?`Lembrete marcado para ${dshort(p.due)} às ${p.rem.slice(11)}.`:p.due?`Tarefa adicionada para ${dshort(p.due)}.`:'Tarefa adicionada, sem prazo.');
  }else if(k==='sub'){
    const n=(d.get('t')||'').trim(),x=taskById(M?.id);if(!n||!x)return;
    x.subs.push({id:uid(),t:n,d:false});M.focus='#subin';
  }else if(k==='event'){
    const n=(d.get('name')||'').trim();if(!n||!d.get('date'))return;
    S.events.push({id:uid(),name:n,date:d.get('date'),subj:d.get('subj')||'',kind:d.get('kind')||'outro'});toast('Prazo adicionado.');
  }else if(k==='topic'){
    const n=(d.get('name')||'').trim();if(!n)return;
    subj(f.dataset.sid)?.topics.push({id:uid(),name:n,studied:null,last:null,rev:0,conf:0});
  }else if(k==='subj'){
    const n=(d.get('name')||'').trim();if(!n)return;
    S.subjects.push({id:uid(),name:n,c:S.subjects.length%8,kind:d.get('kind')||'estudo',wk:Math.round(clamp(Number(d.get('wk'))||0,0,60)*60),topics:[]});toast('Matéria criada.');
  }else if(k==='log'){
    const m=clamp(Math.round(Number(d.get('min'))),1,720);if(!m||!d.get('date'))return;
    const l=addLog(d.get('date'),d.get('subj'),m,'manual');const q=Math.round(Number(d.get('q'))),h=d.get('hit');
    if(q>0){l.q=Math.min(q,999);if(h!==''&&h!=null)l.hit=clamp(Math.round(Number(h)),0,l.q)}
    toast('Estudo registrado.');
  }else if(k==='goals'){
    S.goal=Math.round(clamp(Number(d.get('goal'))||4,0.5,16)*60);toast('Meta salva.');
  }else if(k==='pomo')return;
  save();render();
});

/* ---------- tema e atalhos ---------- */
const TK='rotina-tema',TEMAS=['auto','light','dark'];
function getTema(){try{return localStorage.getItem(TK)||'auto'}catch(e){return 'auto'}}
function applyTema(){
  const t=getTema(),h=document.documentElement;
  if(t==='auto')h.removeAttribute('data-theme');else h.setAttribute('data-theme',t);
  const b=$('#theme');b.querySelector('.ti').textContent={auto:'◐',light:'☀',dark:'☾'}[t];
  b.querySelector('.tl').textContent={auto:'Tema automático',light:'Tema claro',dark:'Tema escuro'}[t];
}
$('#theme').addEventListener('click',()=>{const n=TEMAS[(TEMAS.indexOf(getTema())+1)%3];try{localStorage.setItem(TK,n)}catch(e){}applyTema()});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();M={type:'cmd',q:'',sel:0,focus:'#cmdq'};render();return}
  if(M&&M.type==='cmd'&&['ArrowDown','ArrowUp','Enter'].includes(e.key)){
    e.preventDefault();
    if(e.key==='Enter'){const it=M.items[M.sel];M=null;if(it)it.fn();render();return}
    M.sel=(M.sel+(e.key==='ArrowDown'?1:-1)+M.items.length)%Math.max(1,M.items.length);$('#cmdr').innerHTML=cmdList();return;
  }
  if(M&&M.type==='cards'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if((e.key===' '||e.key==='Enter')&&!M.show){e.preventDefault();ACT['card-show']();return}
    if(M.show&&['1','2','3'].includes(e.key)){e.preventDefault();ACT['card-rate']({dataset:{r:String(Number(e.key)-1)}});return}
  }
  if(e.key==='Escape'&&M){M=null;render();return}
  if(e.key==='/'&&!M&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();M={type:'cmd',q:'',sel:0,focus:'#cmdq'};render();return}
  if(e.ctrlKey||e.metaKey||e.altKey||M||['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;
  if(e.key===' '&&view==='foco'){e.preventDefault();ACT['t-toggle']();render();return}
  if(e.key==='n'||e.key==='N'){e.preventDefault();const f=()=>{const q=$('#qa');if(q)q.focus()};if(view==='hoje'||view==='tarefas')f();else{go('tarefas');setTimeout(f,30)}return}
  const i=Number(e.key);if(i>=1&&i<=VIEWS.length)go(VIEWS[i-1]);
});
let tqh;document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='cmdq'&&M&&M.type==='cmd'){M.q=el.value;M.sel=0;M.items=cmdItems(M.q);$('#cmdr').innerHTML=cmdList();return}if(!el.matches||!el.matches('[data-chg="tq"]'))return;
  clearTimeout(tqh);tqh=setTimeout(()=>{tq=el.value;renderApp();const n=$('#tq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},250);
});
applyTema();

/* ---------- sincronização entre dispositivos (conta do Claude) ---------- */
function syUI(){
  const e=$('#sy');if(!e)return;
  let st=SY.state,L={ok:'Sincronizado com a sua conta',sync:'Sincronizando…',err:'Não foi possível sincronizar'}[st],btn='';
  if(FS.h){st=FS.state;L={ok:'Sincronizado com o arquivo',sync:'Sincronizando…',err:'Falha ao sincronizar o arquivo',perm:'Arquivo desconectado'}[st];
    btn=st==='err'?'<button data-act="fs-now">Tentar de novo</button>':st==='perm'?'<button data-act="fs-reconnect">Reconectar</button>':''}
  else if(GH.tok){st=GH.state;L={ok:'Sincronizado pela internet',sync:'Sincronizando…',err:'Falha ao sincronizar'}[st];btn=st==='err'?'<button data-act="gh-now">Tentar de novo</button>':''}
  else if(st==='err')btn='<button data-act="sy-now">Tentar de novo</button>';
  if(st==='off'||!L){e.hidden=true;return}
  e.hidden=false;e.className='sy '+(st==='perm'?'err':st);
  e.innerHTML=`<i></i><span class="t">${L}</span>${btn}`;
}
function syDirty(){if(!SY.ready)return;clearTimeout(SY.timer);SY.timer=setTimeout(syPush,1500)}
async function syPush(){
  if(!SY.db)return;
  if(SY.busy){SY.again=true;return}
  SY.busy=true;SY.state='sync';syUI();
  try{
    if(!S.mt)S.mt=Date.now();
    const t=S.mt,txt=JSON.stringify(S),parts=[];
    for(let i=0;i<txt.length;i+=90000)parts.push(txt.slice(i,i+90000));
    const col=SY.db.collection('data/users/'+SY.id);
    for(let i=0;i<parts.length;i++)await col.doc('pauta_c'+i).set({i,d:parts[i]});
    await col.doc('pauta').set({t,n:parts.length});
    SY.seen=t;SY.state='ok';
  }catch(e){SY.state='err'}
  SY.busy=false;
  if(SY.again){SY.again=false;syPush()}else syUI();
}
async function syPull(m){
  try{
    const col=SY.db.collection('data/users/'+SY.id);let txt='';
    for(let i=0;i<m.n;i++){const d=await col.doc('pauta_c'+i).get();if(!d.exists)throw 0;txt+=d.data().d}
    const o=JSON.parse(txt);if(!o||!Array.isArray(o.subjects))throw 0;
    S=migrate(o);S.mt=m.t;SY.seen=m.t;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    SY.state='ok';render();syUI();toast('Dados atualizados da sua conta.');
  }catch(e){SY.state='err';syUI()}
}
function syBusyUI(){const a=document.activeElement;return !!M||(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&a.id!=='cmdq')}
function syOnSnap(snap){
  const mine=S.mt||0;
  if(!snap.exists){
    SY.ready=true;
    if(!(S.sample&&!mine))syPush(); else {SY.state='ok';syUI()}
    return;
  }
  const m=snap.data();
  if(!m||m.t===SY.seen){SY.ready=true;SY.state=SY.state==='err'?'err':'ok';syUI();return}
  if(!SY.ready){
    SY.ready=true;
    if(!mine&&!S.sample){SY.pend=m;M={type:'sync'};render();return}   // dados antigos sem marca: perguntar
    if(m.t>mine){SY.pend=m;syPull(m)}else{SY.state='ok';syPush()}
    return;
  }
  if(m.t>mine){
    if(syBusyUI()){setTimeout(()=>syOnSnap(snap),3000);return}
    syPull(m);
  }
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    SY.db=db;SY.id=id;SY.state='sync';syUI();
    const to=setTimeout(()=>{if(!SY.ready){SY.state='err';syUI()}},12000);
    db.collection('data/users/'+id).doc('pauta').onSnapshot(s=>{clearTimeout(to);if(s.metadata&&s.metadata.fromCache&&!s.exists)return;syOnSnap(s)},()=>{SY.state='err';syUI()});
  }catch(e){}
})();

/* ---------- sincronização por arquivo (Drive, OneDrive, Dropbox…) ---------- */
function mergeState(x,y){
  const nx=(x.mt||0)>=(y.mt||0),n=nx?x:y,o=nx?y:x,r=JSON.parse(JSON.stringify(n));
  ['tasks','events','blocks','habits','log'].forEach(k=>{r[k]=r[k]||[];const ids=new Set(r[k].map(i=>i.id));(o[k]||[]).forEach(i=>{if(!ids.has(i.id)){r[k].push(JSON.parse(JSON.stringify(i)));ids.add(i.id)}})});
  const sm=new Map(r.subjects.map(s=>[s.id,s]));
  (o.subjects||[]).forEach(s=>{const t=sm.get(s.id);if(!t)r.subjects.push(JSON.parse(JSON.stringify(s)));else{const ids=new Set((t.topics||[]).map(z=>z.id));(s.topics||[]).forEach(z=>{if(!ids.has(z.id))t.topics.push(JSON.parse(JSON.stringify(z)))})}});
  const hm=new Map(r.habits.map(h=>[h.id,h]));
  (o.habits||[]).forEach(h=>{const t=hm.get(h.id);if(t)t.days=Object.assign({},h.days||{},t.days||{})});
  r.done=r.done||{};Object.keys(o.done||{}).forEach(d=>{r.done[d]=Object.assign({},o.done[d],r.done[d]||{})});
  r.notes=r.notes||{};Object.keys(o.notes||{}).forEach(d=>{if(!r.notes[d])r.notes[d]=o.notes[d]});
  r.pages=r.pages||[];const pm=new Map(r.pages.map(p=>[p.id,p]));(o.pages||[]).forEach(p=>{const t=pm.get(p.id);if(!t)r.pages.push(JSON.parse(JSON.stringify(p)));else if((p.u||0)>(t.u||0))Object.assign(t,JSON.parse(JSON.stringify(p)))});
  r.cards=r.cards||{};Object.keys(o.cards||{}).forEach(k=>{const a=r.cards[k],b=o.cards[k];if(!a||(b.l||'')>(a.l||''))r.cards[k]=b});
  r.sample=!!(n.sample&&o.sample);
  return migrate(r);
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('pauta-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const st=d.transaction('k','readwrite').objectStore('k');const q=v===undefined?st.delete(k):st.put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function fsBase(t){FS.base=t;try{localStorage.setItem('pauta-fsbase',String(t))}catch(e){}}
async function fsRead(){const f=await FS.h.getFile();if(!f.size)return null;try{return JSON.parse(await f.text())}catch(e){return null}}
async function fsWrite(){const w=await FS.h.createWritable();await w.write(JSON.stringify(S));await w.close();fsBase(S.mt||0)}
function fsPersist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fsDirty(){if(!FS.h)return;clearTimeout(FS.timer);FS.timer=setTimeout(()=>fsSync(),1500)}
async function fsSync(manual){
  if(!FS.h||FS.busy)return;FS.busy=true;
  try{
    if(await FS.h.queryPermission({mode:'readwrite'})!=='granted'){FS.state='perm';return}
    FS.state='sync';syUI();
    if(!S.sample&&!S.mt)S.mt=1;
    const o=await fsRead(),lm=S.mt||0;
    if(!o||!Array.isArray(o.subjects)){if(!lm)S.mt=Date.now();fsPersist();await fsWrite();if(manual)toast('Arquivo atualizado.')}
    else{
      const rm=o.mt||0;
      if(rm===lm)fsBase(lm);
      else if(rm>lm&&syBusyUI()&&!manual){FS.state='ok';return}
      else if(S.sample&&!lm){S=migrate(o);S.mt=rm||Date.now();fsPersist();fsBase(S.mt);render();toast('Dados carregados do arquivo.')}
      else if(rm>FS.base&&lm>FS.base){S=mergeState(S,o);S.mt=Date.now();fsPersist();await fsWrite();render();toast('Dados mesclados com o arquivo.')}
      else if(rm>FS.base){S=migrate(o);S.mt=rm;fsPersist();fsBase(rm);render();toast('Dados atualizados do arquivo.')}
      else{await fsWrite();if(manual)toast('Arquivo atualizado.')}
    }
    FS.state='ok';
  }catch(e){FS.state='err'}
  finally{FS.busy=false;syUI();if(view==='progresso'&&!M&&!syBusyUI())renderApp()}
}
async function fsConnect(){
  if(!FSOK){toast('Este navegador não permite. Use Chrome ou Edge no computador.');return}
  try{
    const h=await window.showSaveFilePicker({suggestedName:'pauta-sync.json',types:[{description:'Arquivo do Pauta',accept:{'application/json':['.json']}}]});
    FS.h=h;FS.name=h.name;fsBase(0);try{await idbSet('h',h)}catch(e){}
    await fsSync(true);
  }catch(e){if(!e||e.name!=='AbortError')toast('Não foi possível conectar o arquivo.')}
}
(async()=>{try{if(!FSOK)return;const h=await idbGet('h');if(h){FS.h=h;FS.name=h.name;await fsSync()}}catch(e){}})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fsSync()});
window.addEventListener('focus',()=>fsSync());
setInterval(()=>{if(!document.hidden)fsSync()},30000);

/* ---------- sincronização pela internet (GitHub Gist, com token do próprio usuário) ---------- */
const GHF='pauta-sync.json',GHD='Pauta sync (não apague)';
function ghSave(){try{localStorage.setItem('pauta-gh',JSON.stringify({t:GH.tok,id:GH.id,base:GH.base}))}catch(e){}}
function ghBase(t){GH.base=t;ghSave()}
async function ghApi(path,body,method){
  const h={'Authorization':'Bearer '+GH.tok,'Accept':'application/vnd.github+json'};
  if(body)h['Content-Type']='application/json';
  const r=await fetch('https://api.github.com'+path,{method:method||(body?'POST':'GET'),headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}
  return r.json();
}
async function ghFind(){
  for(let pg=1;pg<=5;pg++){
    const l=await ghApi('/gists?per_page=100&page='+pg);
    const g=l.find(x=>x.description===GHD&&x.files&&x.files[GHF]);
    if(g)return g.id;
    if(l.length<100)break;
  }
  return '';
}
async function ghRead(){
  const g=await ghApi('/gists/'+GH.id),f=g.files&&g.files[GHF];if(!f)return null;
  const txt=f.truncated?await (await fetch(f.raw_url,{cache:'no-store'})).text():f.content;
  try{return JSON.parse(txt)}catch(e){return null}
}
async function ghWrite(){
  await ghApi('/gists/'+GH.id,{files:{[GHF]:{content:JSON.stringify(S)}}},'PATCH');
  ghBase(S.mt||0);
}
function ghDirty(){if(!GH.tok||!GH.id)return;clearTimeout(GH.timer);GH.timer=setTimeout(()=>ghSync(),1500)}
async function ghSync(manual){
  if(!GH.tok||!GH.id||GH.busy)return;GH.busy=true;
  try{
    GH.state='sync';syUI();
    if(!S.sample&&!S.mt)S.mt=1;
    const o=await ghRead(),lm=S.mt||0;
    if(!o||!Array.isArray(o.subjects)){if(!lm)S.mt=Date.now();fsPersist();await ghWrite();if(manual)toast('Sincronizado.')}
    else{
      const rm=o.mt||0;
      if(rm===lm)ghBase(lm);
      else if(rm>lm&&syBusyUI()&&!manual){GH.state='ok';return}
      else if(S.sample&&!lm){S=migrate(o);S.mt=rm||Date.now();fsPersist();ghBase(S.mt);render();toast('Dados carregados da internet.')}
      else if(rm>GH.base&&lm>GH.base){S=mergeState(S,o);S.mt=Date.now();fsPersist();await ghWrite();render();toast('Dados mesclados.')}
      else if(rm>GH.base){S=migrate(o);S.mt=rm;fsPersist();ghBase(rm);render();toast('Dados atualizados.')}
      else{await ghWrite();if(manual)toast('Sincronizado.')}
    }
    GH.state='ok';
  }catch(e){GH.state='err';if(manual||e.status===401)toast(e.status===401?'Token recusado pelo GitHub. Confira se ele tem a permissão "gist".':'Sem conexão com o GitHub agora.')}
  finally{GH.busy=false;syUI();if(view==='progresso'&&!M&&!syBusyUI())renderApp()}
}
async function ghConnect(){
  const el=$('#ghtok'),t=(el&&el.value||'').trim();
  if(!t){toast('Cole o token do GitHub no campo.');return}
  GH.tok=t;GH.id='';GH.base=0;GH.state='sync';syUI();
  try{
    let id=await ghFind();
    if(!id){
      if(!S.mt&&!S.sample)S.mt=1;
      const g=await ghApi('/gists',{description:GHD,public:false,files:{[GHF]:{content:JSON.stringify(S)}}});
      id=g.id;GH.id=id;ghBase(S.mt||0);
    }else GH.id=id;
    ghSave();GH.busy=false;await ghSync(true);
  }catch(e){GH.tok='';GH.state='off';ghSave();syUI();toast(e.status===401?'Token recusado pelo GitHub. Gere um novo com a permissão "gist".':'Não foi possível conectar ao GitHub.')}
  if(view==='progresso')renderApp();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)ghSync()});
window.addEventListener('focus',()=>ghSync());
setInterval(()=>{if(!document.hidden)ghSync()},30000);
if(GH.tok&&GH.id)ghSync();
/* ---------- tela de recuperação em caso de erro ---------- */
window.addEventListener('error',e=>{
  const a=document.getElementById('app');
  if(a&&!a.children.length){a.innerHTML=`<section class="view"><header><div><h1>Algo deu errado</h1><p>${esc(String(e.message||e))}</p></div></header><div class="card"><div class="ctl" style="justify-content:flex-start"><button class="btn primary" onclick="location.reload()">Recarregar</button><button class="btn" onclick="try{var t=localStorage.getItem('${KEY}');if(t){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='pauta-backup.json';a.click()}}catch(x){}">Baixar cópia dos dados</button><button class="btn ghost" onclick="try{localStorage.removeItem('${KEY}');localStorage.removeItem('pauta-fsbase')}catch(x){}location.reload()">Apagar dados deste navegador</button></div></div></section>`}
});
})();
